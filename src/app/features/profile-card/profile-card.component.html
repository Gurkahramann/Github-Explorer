<div class="animate-fade-in bg-slate-800/50 backdrop-blur-sm rounded-3xl ring-1 ring-white/10 p-8 flex flex-col items-center text-center gap-5 lg:sticky lg:top-8">

  <!-- Avatar with online indicator -->
  <div class="relative">
    <img
      [src]="user().avatar_url"
      [alt]="user().name || user().login"
      loading="lazy"
      width="112"
      height="112"
      class="rounded-full ring-4 ring-amber-500/30 shadow-2xl shadow-black/40"
    />
    <span
      class="absolute bottom-0.5 right-0.5 w-4 h-4 bg-amber-500 rounded-full ring-2 ring-slate-900"
      aria-hidden="true"
    ></span>
  </div>

  <!-- Name + Login -->
  <div class="flex flex-col gap-1">
    <h2 class="text-2xl font-bold text-white leading-tight">
      {{ user().name || user().login }}
    </h2>
    @if (user().name) {
      <p class="text-amber-400 text-sm font-medium">&#64;{{ user().login }}</p>
    }
  </div>

  <!-- Bio -->
  @if (user().bio) {
    <p class="text-slate-300 text-sm leading-relaxed max-w-xs">{{ user().bio }}</p>
  }

  <!-- Divider -->
  <div class="w-full h-px bg-white/10"></div>

  <!-- Stats -->
  <div class="w-full grid grid-cols-3 gap-2">
    <div class="flex flex-col items-center gap-1 py-2">
      <span class="text-xl font-bold text-white">{{ formatStat(user().followers) }}</span>
      <span class="text-slate-500 text-xs uppercase tracking-widest">Takipçi</span>
    </div>
    <div class="flex flex-col items-center gap-1 py-2 border-x border-white/10">
      <span class="text-xl font-bold text-white">{{ formatStat(user().following) }}</span>
      <span class="text-slate-500 text-xs uppercase tracking-widest">Takip</span>
    </div>
    <div class="flex flex-col items-center gap-1 py-2">
      <span class="text-xl font-bold text-white">{{ formatStat(user().public_repos) }}</span>
      <span class="text-slate-500 text-xs uppercase tracking-widest">Repo</span>
    </div>
  </div>

  <!-- GitHub Button -->
  <a
    [href]="user().html_url"
    target="_blank"
    rel="noopener noreferrer"
    class="w-full flex items-center justify-center gap-2 py-3 bg-amber-500/10 hover:bg-amber-500/20 text-amber-400 text-sm font-semibold rounded-2xl ring-1 ring-amber-500/20 hover:ring-amber-500/40 transition-all duration-200"
  >
    <svg
      xmlns="http://www.w3.org/2000/svg"
      width="15"
      height="15"
      viewBox="0 0 24 24"
      fill="currentColor"
      aria-hidden="true"
    >
      <path d="M12 0C5.374 0 0 5.373 0 12c0 5.302 3.438 9.8 8.207 11.387.599.111.793-.261.793-.577v-2.234c-3.338.726-4.033-1.416-4.033-1.416-.546-1.387-1.333-1.756-1.333-1.756-1.089-.745.083-.729.083-.729 1.205.084 1.839 1.237 1.839 1.237 1.07 1.834 2.807 1.304 3.492.997.107-.775.418-1.305.762-1.604-2.665-.305-5.467-1.334-5.467-5.931 0-1.311.469-2.381 1.236-3.221-.124-.303-.535-1.524.117-3.176 0 0 1.008-.322 3.301 1.23A11.509 11.509 0 0 1 12 5.803c1.02.005 2.047.138 3.006.404 2.291-1.552 3.297-1.23 3.297-1.23.653 1.653.242 2.874.118 3.176.77.84 1.235 1.911 1.235 3.221 0 4.609-2.807 5.624-5.479 5.921.43.372.823 1.102.823 2.222v3.293c0 .319.192.694.801.576C20.566 21.797 24 17.3 24 12c0-6.627-5.373-12-12-12z"/>
    </svg>
    GitHub'da Gör
  </a>
</div>
